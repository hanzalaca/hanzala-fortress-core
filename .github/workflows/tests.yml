name: Tests

# Public repository: GitHub-hosted runners are free here. Fork pull requests
# never run on a self-hosted machine.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-vectors:
    name: Python reference vectors
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pynacl
      - name: Check vectors and fixture
        run: python Scripts/vault_format_reference/open_vault.py --check-vectors
      - name: Generator reproduces the committed fixture
        run: |
          cd Scripts/vault_format_reference
          python generate_fixture.py
          test -z "$(git status --porcelain -- ../../Tests/HanzalaomatorCoreTests/Fixtures)"

  kotlin:
    name: Kotlin vault core
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pynacl
      - name: Test
        working-directory: Android
        run: gradle :vault-core:test --no-daemon

  swift:
    name: Swift core
    if: github.event.pull_request.draft != true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --parallel
