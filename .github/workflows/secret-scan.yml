name: Secret Scan

# Runs gitleaks so a committed key is caught before merge. A pull request scans
# its own commits; "Run workflow" (workflow_dispatch) scans the whole history.
# Pull requests and on demand only, to keep hosted Actions minutes low.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits through the API; on a private
      # repository that needs an explicit pull-requests grant.
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The findings are in the log; a report artifact only uses billed storage.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
